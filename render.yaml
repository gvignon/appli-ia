services:
  - type: web
    name: cours-accessible
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: IA_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        sync: false
